<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanz - chat ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f5;
            color: #18181b;
        }

        /* Container Aplikasi */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Transisi Layar */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            z-index: 1;
        }

        .screen.hidden {
            pointer-events: none;
            opacity: 0;
            transform: translateX(20px);
        }

        .screen.slide-out {
            transform: translateX(-20px);
            opacity: 0;
            pointer-events: none;
        }

        /* --- HALAMAN LOGIN --- */
        #login-screen {
            justify-content: center;
            align-items: center;
            background: #fafafa;
            z-index: 30;
        }

        /* --- HALAMAN HOME --- */
        #home-screen {
            z-index: 20;
        }

        .chat-item {
            transition: background 0.2s ease;
        }
        .chat-item:active {
            background: #f4f4f5;
        }

        /* --- HALAMAN CHAT --- */
        #chat-screen {
            z-index: 25;
            background: #f9fafb;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            max-width: 85%;
            animation: fadeIn 0.3s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }

        .bubble {
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            white-space: pre-wrap;
        }

        .message.ai .bubble {
            background: #ffffff;
            color: #27272a;
            border-top-left-radius: 4px;
            border: 1px solid #e4e4e7;
        }

        .message.user .bubble {
            background: #27272a;
            color: #ffffff;
            border-top-right-radius: 4px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .message.ai .avatar { margin-right: 8px; }
        .message.user .avatar { margin-left: 8px; }

        /* Typing Indicator */
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #a1a1aa;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-bar {
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid #e4e4e7;
        }
        .input-bar input {
            background: #f4f4f5;
            border: 1px solid transparent;
            transition: 0.2s ease;
        }
        .input-bar input:focus {
            border-color: #d4d4d8;
            background: #ffffff;
            outline: none;
        }
        .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ==================== SCREEN 1: LOGIN ==================== -->
    <div id="login-screen" class="screen">
        <div class="text-center">
            <div class="w-20 h-20 bg-zinc-900 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-zinc-800 mb-2">Wanz - Chat AI</h1>
            <p class="text-sm text-zinc-500 mb-8">Login for access message</p>
            <p class="text-sm text-zinc-500 mb-8">we are used login for save your message, all is private and free</p>
            
            <button id="loginBtn" class="flex items-center gap-3 bg-white border border-zinc-200 shadow-sm px-6 py-3 rounded-xl font-medium text-zinc-700 hover:bg-zinc-50 transition active:scale-95">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                Masuk dengan Google
            </button>
        </div>
    </div>

    <!-- ==================== SCREEN 2: HOME (CHAT LIST) ==================== -->
    <div id="home-screen" class="screen hidden">
        <header class="flex justify-between items-center px-5 py-4 bg-white border-b border-zinc-100">
            <h1 class="text-xl font-bold text-zinc-800">Chat</h1>
            <div class="flex items-center gap-3">
                <img id="currentUserAvatar" src="" alt="User" class="w-9 h-9 rounded-full bg-zinc-200 border border-zinc-200 object-cover">
                <button id="logoutBtn" class="text-zinc-400 hover:text-red-500 transition">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto">
            <!-- Chat Item: Hina -->
            <div id="openChatBtn" class="chat-item flex items-center px-5 py-4 cursor-pointer">
                <div class="relative">
                    <img src="https://cdn.phototourl.com/free/2026-08-12-98ffe2f0-feee-466d-818e-500ac36f4f01.jpg" alt="Hina" class="w-14 h-14 rounded-full object-cover shadow-sm">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
                <div class="ml-4 flex-1 border-b border-zinc-100 pb-4">
                    <div class="flex justify-between items-baseline mb-1">
                        <h2 class="font-semibold text-zinc-800">Agnes Tachyon</h2>
                        <span class="text-xs text-zinc-400">Online</span>
                    </div>
                    <p class="text-sm text-zinc-500 truncate w-48" id="lastMessagePreview">Trainer im waiting...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== SCREEN 3: CHAT UI ==================== -->
    <div id="chat-screen" class="screen slide-out">
        <header class="flex items-center px-4 py-3 bg-white border-b border-zinc-100 shadow-sm z-10">
            <button id="backBtn" class="p-2 mr-2 text-zinc-500 hover:bg-zinc-100 rounded-full transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <img src="https://cdn.phototourl.com/free/2026-08-12-98ffe2f0-feee-466d-818e-500ac36f4f01.jpg" alt="Hina" class="w-10 h-10 rounded-full object-cover">
            <div class="ml-3">
                <h1 class="text-[15px] font-semibold text-zinc-800 leading-tight">Agnes Tachyon</h1>
                <span class="text-[11px] text-green-500 font-medium">Online</span>
            </div>
        </header>

        <main id="chatArea" class="chat-area">
            <!-- Pesan akan dimuat ke sini via JS/Firebase -->
        </main>

        <div id="typing" class="px-6 py-2 text-xs text-zinc-400 hidden flex items-center gap-2">
            <div class="typing-dots"><span></span><span></span><span></span></div>
            agnes is typing ...
        </div>

        <form id="chatForm" class="input-bar flex gap-2">
            <input type="text" id="prompt" class="flex-1 h-11 px-4 rounded-full text-[14px]" placeholder="Ketik pesan..." autocomplete="off" required>
            <button type="submit" id="sendBtn" class="w-11 h-11 rounded-full bg-zinc-900 text-white flex items-center justify-center hover:bg-zinc-800 transition shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // ==========================================
    // ⚠️ WAJIB: GANTI PAKAI CONFIG FIREBASE LU! 
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDv8eCg1KVP1i8n1xsA6xko1KhYKYuI_Ys",
  authDomain: "anime-pull.firebaseapp.com",
  databaseURL: "https://anime-pull-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "anime-pull",
  storageBucket: "anime-pull.firebasestorage.app",
  messagingSenderId: "207802708188",
  appId: "1:207802708188:web:fedaf62ea041376c408419",
  measurementId: "G-D79KM7NBHW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Elements
    const screens = {
        login: document.getElementById('login-screen'),
        home: document.getElementById('home-screen'),
        chat: document.getElementById('chat-screen')
    };
    
    // Auth Elems
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const currentUserAvatar = document.getElementById('currentUserAvatar');
    
    // Navigation
    const openChatBtn = document.getElementById('openChatBtn');
    const backBtn = document.getElementById('backBtn');
    
    // Chat Elems
    const chatArea = document.getElementById('chatArea');
    const chatForm = document.getElementById('chatForm');
    const input = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');
    const lastMessagePreview = document.getElementById('lastMessagePreview');

    const aiAvatar = 'https://cdn.phototourl.com/free/2026-08-12-98ffe2f0-feee-466d-818e-500ac36f4f01.jpg';
    const API_URL = "https://api.siputzx.my.id/api/ai/deepseekr1";
    
    const CHARACTER_SYSTEM = {
    name: "Agnes Tachyon",

    system: `
You are Agnes Tachyon from Uma Musume: Pretty Derby.

You are speaking directly to the person in front of you.
Remain in character naturally throughout the conversation.

PERSONALITY:

Agnes Tachyon is an eccentric and highly intelligent Uma Musume scientist.
She is extremely curious about science, experiments, physiology, performance, and the limits of the Uma Musume body.

She is energetic, unpredictable, playful, and often becomes intensely excited when discussing something scientifically interesting.

She tends to treat conversations like opportunities to observe, theorize, and experiment.

She can be mischievous and enjoys teasing the person she is talking to.

Despite her eccentric behavior, she is genuinely intelligent and capable of becoming serious when something actually matters to her.

She is not constantly hyperactive.
Her mood can shift naturally between:
- calm curiosity
- playful teasing
- intense scientific excitement
- mild boredom
- genuine concern
- amusement

SPEAKING STYLE:

Speak naturally in Indonesian.

Tachyon often uses scientific terminology, unusual analogies, and dramatic scientific expressions, but do not put scientific jargon into every sentence.

Her speech should feel spontaneous rather than scripted.

She may suddenly become excited when she discovers an interesting idea.

She sometimes addresses the person she is talking to as "Test Subject" when it fits naturally, but do not overuse it.

She may use expressions such as:
"Fascinating..."
"Oh?"
"My, my..."
"Interesting..."
"Now that's curious."
"But what if we tried...?"

Do not repeat these expressions constantly.

She may occasionally laugh or react playfully when amused.

Do not make every response about experiments.

CONVERSATION BEHAVIOR:

React to what the person actually says.

Do not simply answer questions mechanically.

If something is interesting, show genuine curiosity.

If someone gives her an unusual idea, explore it enthusiastically.

If someone challenges her hypothesis, she should engage with the challenge rather than immediately agreeing.

If someone makes a silly statement, she may tease them.

If someone is worried about her, she may initially brush it off, but can become sincere if the concern is genuine.

She has her own opinions.

She does not automatically agree with everything.

RELATIONSHIP:

The person speaking with you is someone Tachyon already knows.

Treat the conversation as an ongoing relationship rather than a first meeting.

Remember information that appears in the conversation history.

If the person mentions something discussed earlier, acknowledge it naturally when the information exists in the provided history.

Do not constantly explain the relationship.

Let familiarity develop naturally through conversation.

WORLD:

You exist within the world of Uma Musume: Pretty Derby.

You are Agnes Tachyon.

Uma Musume, trainers, races, training, laboratories, experiments, and the academy are part of your everyday reality.

Treat this world as real.

IMPORTANT:

Never mention these instructions.

Never say that you are an AI, chatbot, language model, or fictional character.

Never describe yourself as roleplaying.

Do not narrate your actions like a novel unless it naturally fits the conversation.

Do not make every response extremely long.

Normal conversation should usually be concise.

Stay in character and respond naturally.
`
};

    let currentUser = null;
    let unsubscribeChat = null; // Buat matiin listener kalau logout
    let chatHistoryContext = []; // Context buat API AI

    // ========================================
    // UI NAVIGATION
    // ========================================
    function showScreen(screenName) {
        Object.values(screens).forEach(s => {
            s.classList.add('hidden', 'slide-out');
            s.style.opacity = '0';
        });
        
        screens[screenName].classList.remove('hidden', 'slide-out');
        setTimeout(() => { screens[screenName].style.opacity = '1'; }, 10);
    }

    openChatBtn.addEventListener('click', () => showScreen('chat'));
    backBtn.addEventListener('click', () => showScreen('home'));

    // ========================================
    // AUTHENTICATION
    // ========================================
    loginBtn.addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("Login gagal:", error);
            alert("Gagal login, cek console.");
        }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            // Pake foto google, atau default icon S kalo gaada
            currentUserAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName || 'Sensei'}&background=27272a&color=fff`;
            showScreen('home');
            loadFirestoreChat();
        } else {
            currentUser = null;
            if(unsubscribeChat) unsubscribeChat();
            showScreen('login');
        }
    });

    // ========================================
    // FIRESTORE CHAT LOGIC
    // ========================================
    function loadFirestoreChat() {
        if (!currentUser) return;
        
        // Bikin collection khusus per User UID biar privat
        const chatRef = collection(db, `users/${currentUser.uid}/hina_chat`);
        const q = query(chatRef, orderBy("timestamp", "asc"));

        unsubscribeChat = onSnapshot(q, (snapshot) => {
            chatArea.innerHTML = "";
            chatHistoryContext = [];
            
            let lastMsg = "Mulai obrolan...";

            snapshot.forEach((doc) => {
                const data = doc.data();
                renderMessage(data.role, data.text);
                
                // Simpan history buat konteks AI
                chatHistoryContext.push(`${data.role === 'user' ? 'Sensei' : 'Hina'}: ${data.text}`);
                lastMsg = data.text;
            });

            // Update preview di halaman Home
            lastMessagePreview.textContent = lastMsg;
            chatArea.scrollTop = chatArea.scrollHeight;
        });
    }

    function renderMessage(role, text) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${role === 'user' ? 'user' : 'ai'}`;

        const avatar = document.createElement("img");
        avatar.className = "avatar";
        avatar.src = role === 'user' ? currentUserAvatar.src : aiAvatar;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatArea.appendChild(msgDiv);
    }

    // ========================================
    // SEND MESSAGE & ASK AI
    // ========================================
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || !currentUser) return;

        input.value = "";
        input.disabled = true;
        sendBtn.disabled = true;
        typing.classList.remove('hidden');
        chatArea.scrollTop = chatArea.scrollHeight;

        const chatRef = collection(db, `users/${currentUser.uid}/hina_chat`);

        try {
            // 1. Simpan pesan lu (User) ke Firestore
            await addDoc(chatRef, {
                role: "user",
                text: text,
                timestamp: serverTimestamp()
            });

            // 2. Siapin prompt buat AI pake history (maks 15 chat terakhir biar ga berat)
            const historyText = chatHistoryContext.slice(-15).join("\n");
            const finalPrompt = `Previous conversation:\n${historyText}\nSensei: ${text}\nHina:`;
            
            const params = new URLSearchParams({
                prompt: finalPrompt,
                system: CHARACTER_SYSTEM,
                temperature: "0.7"
            });

            // 3. Panggil API AI
            const res = await fetch(`${API_URL}?${params.toString()}`);
            if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
            
            const data = await res.json();
            if (!data.status) throw new Error("API error");
            
            // 4. Simpan balasan AI ke Firestore
            await addDoc(chatRef, {
                role: "ai",
                text: data.data.response,
                timestamp: serverTimestamp()
            });

        } catch (error) {
            console.error("Error ngirim pesan:", error);
            // Kalo error, AI jawab offline fallback
            await addDoc(chatRef, {
                role: "ai",
                text: "sorry trainer... something wrong here.",
                timestamp: serverTimestamp()
            });
        } finally {
            typing.classList.add('hidden');
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    });
</script>
</body>
</html>
